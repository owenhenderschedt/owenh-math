<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-rb.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      /*
       * Restore clean React Router URLs after GitHub Pages sends
       * a direct route through 404.html.
       */
      ;(function (location) {
        if (location.search.startsWith('?/')) {
          const route = location.search
            .slice(2)
            .split('&')
            .map((part) => part.replace(/~and~/g, '&'))
            .join('?')

          window.history.replaceState(
            null,
            '',
            '/' + route + location.hash,
          )
        }
      })(window.location)
    </script>
    <meta name="description" content="Owen Henderschedt is a mathematician working in graph theory and discrete geometry. Explore research papers, teaching, and interactive mathematics." />
    <title>Owen Henderschedt | Math</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
