<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>

    <script>
      /*
       * GitHub Pages serves this file when a React route such as /cv
       * is requested directly.
       *
       * We preserve the requested path, send the browser back through
       * index.html, and let React Router restore the clean URL.
       *
       * pathSegmentsToKeep = 0 because this site lives at the root of
       * new.owenh-math.com rather than under /owenh-math/.
       */
      var pathSegmentsToKeep = 0

      var l = window.location

      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search
            ? '&' + l.search.slice(1).replace(/&/g, '~and~')
            : '') +
          l.hash,
      )
    </script>
  </head>

  <body></body>
</html>
