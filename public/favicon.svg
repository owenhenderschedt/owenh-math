<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="O formed by a properly two-colored 4-cycle"
>
  <!-- cycle edges -->
  <path
    d="M32 8
       C45 8 56 19 56 32
       C56 45 45 56 32 56
       C19 56 8 45 8 32
       C8 19 19 8 32 8Z"
    fill="none"
    stroke="#304b38"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- properly 2-colored C4 vertices -->
  <circle cx="32" cy="8"  r="6" fill="#304b38" />
  <circle cx="56" cy="32" r="6" fill="#b99b56" />
  <circle cx="32" cy="56" r="6" fill="#304b38" />
  <circle cx="8"  cy="32" r="6" fill="#b99b56" />
</svg>
